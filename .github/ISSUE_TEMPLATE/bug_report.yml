name: Bug report
description: Something in WingletReader is broken or behaves wrong.
title: "[bug]: "
labels: ["bug", "alpha"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping harden the alpha. This tracker is for **bugs** —
        things that are broken or clearly wrong.

        Have an idea, a feature request, or a question instead? Please post in
        [**Discussions**](https://github.com/winglet-stack/WingletReader/discussions)
        — it won't get lost there.

        For a **security vulnerability**, do **not** file here — see
        [SECURITY.md](https://github.com/winglet-stack/WingletReader/blob/master/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app, or in the installer filename (e.g. 0.2.1-alpha).
      placeholder: "0.2.1-alpha"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Windows version (alpha ships Windows-only).
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact sequence, from a fresh start if you can.
      placeholder: |
        1. Open the Library
        2. Import a .pdf
        3. Press Read
        4. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you thought would happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened. Include any error text on screen.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log file (if a crash or error)
      description: |
        WingletReader writes a log at `%APPDATA%\wingletreader\logs\main.log`.
        Paste the tail, or attach the file. It contains no personal data beyond
        file paths.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, frequency (always / sometimes), a sample file, etc.
    validations:
      required: false
